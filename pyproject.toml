[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "migrationguard"
version = "0.1.0"
description = "Evidence-driven agent harness for safe dependency migration (Pydantic v1 → v2 first)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MigrationGuard contributors" }]
keywords = ["migration", "codemod", "pydantic", "agents", "claude", "verification", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6,<3",
  "libcst>=1.4",
  "packaging>=23.2",
  "anyio>=4.0",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
  "uv>=0.4",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1.0"]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "claude-agent-sdk>=0.1.0",
]

[project.scripts]
migrationguard = "migrationguard.cli:main"
mguard = "migrationguard.cli:main"

[project.urls]
Homepage = "https://github.com/migrationguard/migrationguard"

[tool.hatch.build.targets.wheel]
packages = ["src/migrationguard"]

[tool.hatch.build.targets.wheel.force-include]
"benchmarks" = "migrationguard/_benchmarks"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: needs uv-provisioned Python environments (network on first run, cached afterwards)",
  "docker: needs a running Docker daemon and the runtime image",
  "live: calls the real Claude API through the Claude Agent SDK (costs money)",
]
timeout = 900

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["benchmarks/cases", "examples/*/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012", "SIM102", "SIM105", "SIM108", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# executed inside the sandbox with the *project's* interpreter: must stay Python 3.8 compatible
"src/migrationguard/sandbox/runtime/*.py" = ["UP", "SIM", "RUF", "B", "E402"]
"src/migrationguard/cli.py" = ["UP007", "UP045"]
"tests/fixtures/*" = ["ALL"]
# deliberately exercises typing.Optional / typing.Union alongside PEP 604 unions
"tests/unit/test_runtime_helpers.py" = ["UP007", "UP045"]

[tool.coverage.run]
source = ["migrationguard"]
# subprocesses (CLI crash/resume test) are measured too
parallel = true
concurrency = ["thread"]

[tool.coverage.paths]
source = ["src/migrationguard", "*/site-packages/migrationguard"]

[tool.coverage.report]
show_missing = false
skip_empty = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
